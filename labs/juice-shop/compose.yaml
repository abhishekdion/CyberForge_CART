services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated_lab
  cart-runner:
    image: python:3.13-slim
    entrypoint:
      - python
      - -m
      - cart.cli
    command:
      - --help
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
    volumes:
      - ../../:/workspace
      - cart_state:/state
    network_mode: "service:juice-shop"
    depends_on:
      - juice-shop
    profiles:
      - test

networks:
  isolated_lab:
    internal: true

volumes:
  cart_state:
